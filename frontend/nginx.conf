map $host $cmc_app_root {
  default /usr/share/nginx/html/customer;
  cmcrestaurant.app /usr/share/nginx/html/customer;
  staging.cmcrestaurant.app /usr/share/nginx/html/customer;
  order.cmcrestaurant.app /usr/share/nginx/html/ordering;
  order-staging.cmcrestaurant.app /usr/share/nginx/html/ordering;
  admin.cmcrestaurant.app /usr/share/nginx/html/admin;
  admin-staging.cmcrestaurant.app /usr/share/nginx/html/admin;
  staff.cmcrestaurant.app /usr/share/nginx/html/admin;
  staff-staging.cmcrestaurant.app /usr/share/nginx/html/admin;
  kitchen.cmcrestaurant.app /usr/share/nginx/html/admin;
  kitchen-staging.cmcrestaurant.app /usr/share/nginx/html/admin;
}

server {
  listen 8080;
  server_name _;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://images.unsplash.com https://api.vietqr.io https://order.cmcrestaurant.app https://cmcrestaurant.app; connect-src 'self' https: wss:; frame-src https://www.google.com; form-action 'self'; upgrade-insecure-requests" always;

  root $cmc_app_root;
  index index.html;


  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
