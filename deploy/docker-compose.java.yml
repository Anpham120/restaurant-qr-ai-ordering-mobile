# Biến thể Docker Compose chạy backend Java thay cho backend .NET (môn Triển khai phần mềm, §8).
#
# CHỈ CHẠY CỤC BỘ. File này không thay thế `docker-compose.yml` và không bao giờ được dùng để deploy
# lên VPS chung của nhóm — VPS đó đang phục vụ điểm môn INFO2005 của 4 người khác (§8.1).
#
# Khác `docker-compose.yml` gốc ở ba chỗ, đều có lý do:
#
# 1. `network_mode: host` -> mạng bridge riêng. Bản gốc dùng host vì nó chạy trên VPS Linux một
#    máy; ở đây mục tiêu là chạy được trên máy lập trình (kể cả Windows/macOS, nơi `host` không
#    hoạt động như trên Linux). Bridge cũng cho phép chạy SONG SONG với stack .NET mà không tranh
#    cổng — chính là thứ issue #15 cần để so khớp hành vi hai bản.
#
# 2. Tên biến môi trường theo convention Spring Boot (`PAYMENTS_VIETQR_BANKID`) thay vì hai gạch
#    dưới của .NET (`Payments__VietQr__BankId`). Cùng một giá trị, đọc từ cùng một file `.env`.
#
# 3. `migrate` chạy `--migrate-only` bằng Flyway thay vì EF Core, nhưng giữ nguyên nguyên tắc V10:
#    migration là một bước tách rời, API không tự migrate lúc khởi động.

name: ${COMPOSE_PROJECT_NAME:-cmc-restaurant-java}

x-api-environment: &api-environment
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-restaurant_qr}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-restaurant_user}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  BACKEND_JAVA_PORT: 8081
  JWT_ISSUER: ${JWT_ISSUER:-RestaurantQrAiOrdering}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-RestaurantQrAiOrdering.Client}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
  JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-60}
  # Tài khoản quản trị đầu tiên. Bỏ trống = không tạo gì, và đó là mặc định đúng: chỉ lần triển
  # khai đầu lên một cơ sở dữ liệu trống mới cần tới chúng.
  ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
  ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
  ADMIN_BOOTSTRAP_FULL_NAME: ${ADMIN_BOOTSTRAP_FULL_NAME:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
  PAYMENTS_VIETQR_BANKID: ${PAYMENTS_VIETQR_BANKID:-}
  PAYMENTS_VIETQR_ACCOUNTNUMBER: ${PAYMENTS_VIETQR_ACCOUNTNUMBER:-}
  PAYMENTS_VIETQR_ACCOUNTNAME: ${PAYMENTS_VIETQR_ACCOUNTNAME:-}
  PAYMENTS_VIETQR_TEMPLATE: ${PAYMENTS_VIETQR_TEMPLATE:-compact2}
  # Để trống thì webhook từ chối mọi lời gọi — trạng thái an toàn, xem issue #12.
  PAYMENTS_SEPAY_APIKEY: ${PAYMENTS_SEPAY_APIKEY:-}
  # Xác minh số điện thoại lúc đăng ký (OTP) và đăng nhập Google. Để trống thì cả hai đường TỪ CHỐI
  # mọi lời gọi — cùng luật an toàn với khoá webhook ở trên.
  FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
  AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
  # 50 giây, và phải LỚN HƠN `LLM_TIMEOUT_SECONDS` (30) của dịch vụ AI: dịch vụ phải hết hạn
  # TRƯỚC backend thì backend mới nhận được câu thoái hoá của nó, thay vì tự hết hạn rồi trả lỗi
  # cho khách đang ngồi ở bàn. Giá trị cũ ở đây là 12 — tức ĐẢO NGƯỢC quan hệ, và bản .NET có test
  # canh đúng chỗ này (`DeploymentConfigurationTests`) trong khi bản Java thì không.
  BACKEND_AI_TIMEOUT_SECONDS: ${BACKEND_AI_TIMEOUT_SECONDS:-50}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_qr}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data-java:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot. Giữ đúng nguyên tắc V10 của bản .NET: schema được migrate bởi một bước riêng, không
  # phải bởi API lúc boot — nhiều instance API cùng migrate một CSDL là đúng loại lỗi chỉ xảy ra khi
  # deploy thật.
  migrate:
    image: ${BACKEND_JAVA_IMAGE:-cmc-restaurant-api-java:${DEPLOY_ENV:-local}}
    build:
      context: ..
      dockerfile: backend-java/Dockerfile
    restart: "no"
    command: ["--migrate-only"]
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${BACKEND_JAVA_IMAGE:-cmc-restaurant-api-java:${DEPLOY_ENV:-local}}
    build:
      context: ..
      dockerfile: backend-java/Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-environment
      # API không tự migrate: `migrate` ở trên đã làm việc đó và phải chạy xong trước.
      SPRING_FLYWAY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Địa chỉ gắn cổng đổi theo môi trường, mặc định mở cho MỌI giao diện.
      #
      # Local phải mở: điện thoại thật gọi vào http://<IP-LAN>:8081, đó là cách duy nhất chạy thử
      # trên máy thật khi không có máy dựng riêng (§9.10).
      #
      # Trên máy chủ công khai phải đặt BACKEND_JAVA_BIND=127.0.0.1. Để nguyên 0.0.0.0 nghĩa là
      # gọi thẳng http://<ip>:8081 được, ĐI VÒNG qua nginx — tức đi vòng qua TLS, và khoá webhook
      # SePay sẽ đi qua mạng ở dạng chữ thường.
      # Cổng HOST lấy từ BACKEND_PORT — CÙNG biến mà write-nginx-config.sh dùng để proxy.
      #
      # Trước đây chỗ này đọc BACKEND_JAVA_PORT, một cái tên KHÔNG tệp env nào khai, nên nó rơi về
      # mặc định 8081. Hai hậu quả, đo thật trên máy chủ:
      #   1. Đụng FRONTEND_PORT=8081 của staging -> "port is already allocated".
      #   2. nginx proxy tới 127.0.0.1:5001 trong khi api nghe 8081 -> kể cả không đụng cổng thì
      #      cũng không ai trả lời.
      # BACKEND_JAVA_PORT ở khối environment phía trên vẫn giữ: đó là cổng BÊN TRONG container.
      - "${BACKEND_JAVA_BIND:-0.0.0.0}:${BACKEND_PORT:-8081}:8081"
    healthcheck:
      # Cùng endpoint `/api/health` với bản .NET, nên pattern healthcheck không đổi.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # JVM khởi động chậm hơn .NET đáng kể; đặt thấp thì container bị đánh dấu unhealthy trong
      # lúc nó vẫn đang boot bình thường.
      start_period: 60s

  ai-service:
    # Trong profile "ai" nên MẶC ĐỊNH KHÔNG dựng và không chạy. Bật bằng COMPOSE_PROFILES=ai.
    #
    # Hai lý do, và lý do thứ hai đúng cả khi lý do thứ nhất hết:
    #
    # 1. Máy chủ hiện tại phơi CPU model qemu64 — chỉ có sse4_2, không avx/avx2. torch dựng sẵn
    #    chết ngay khi dựng ảnh với SIGILL (exit 132). Đo thật trên 221.121.2.60.
    # 2. Hệ thống gọi món KHÔNG nên chết theo trợ lý. Trước đây api khai depends_on ai-service
    #    service_healthy, nên một dịch vụ phụ hỏng là cả quán không nhận đơn được. Backend đã có
    #    sẵn đường thoái hoá: hết thời gian chờ thì trả câu chuyển nhân viên.
    profiles: ["ai"]
    image: ${AI_SERVICE_IMAGE:-cmc-restaurant-ai:${DEPLOY_ENV:-local}}
    build:
      context: ..
      dockerfile: ai/Dockerfile
    restart: unless-stopped
    # Khối biến giữ ĐÚNG danh sách của `docker-compose.yml` (bản .NET), vì cùng một ảnh dịch vụ AI
    # đọc cùng những biến đó. Trước đây khối này chỉ có hai biến, và hệ quả lộ ra ngay khi
    # `golden-e2e` chuyển sang stack Java: câu thử `/ready` đỏ với `model_base_url_set: False`, tức
    # dịch vụ chạy mà KHÔNG biết gọi mô hình ở đâu.
    #
    # CỐ Ý KHÔNG đặt `AI_SERVICE_HOST`. Bản .NET đặt `127.0.0.1` vì nó dùng `network_mode: host`;
    # chép sang đây thì dịch vụ chỉ nghe loopback TRONG container, và cả backend lẫn cổng đã publish
    # đều không với tới. Để trống thì `ai/Dockerfile` cấp `0.0.0.0` — đúng thứ mạng bridge cần.
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      AI_SERVICE_PORT: 8001
      # Tên container trong mạng compose. KHÔNG dùng 127.0.0.1: trong container đó là chính nó,
      # không phải máy chủ. Và KHÔNG dùng host.docker.internal: tên đó chỉ có trên Docker Desktop,
      # còn máy chủ chạy Linux — mặc định cũ trỏ vào hư không, trợ lý im lặng trả câu thoái hoá.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://9router:20128/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-cx/gpt-5.6-luna-review}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      AI_ENABLE_GENERATION: ${AI_ENABLE_GENERATION:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    mem_limit: 3g
    # Publish CHỈ trên loopback (#58). Bản .NET dùng `network_mode: host` nên dịch vụ AI vốn đã ở
    # trên host; stack Java dùng bridge nên nếu không publish thì `wait_for_stack.py` và
    # `run_deploy_probes.py` — hai script chạy trên máy CI, không phải trong container — không với
    # tới được. Ràng vào 127.0.0.1 chứ không phải 0.0.0.0: dịch vụ này chỉ để backend gọi, không
    # phải để lộ ra mạng, và nó chỉ có một lớp gác là AI_INTERNAL_TOKEN.
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=3); exit(0 if b'ready' in r.read() else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Frontend. Trước đây chỉ có ở compose bản .NET, nên `docker compose up` trên stack Java dựng
  # được API mà không có giao diện — tức không chạy thử được cả hệ thống bằng một lệnh.
  # Cổng LLM. Nằm TRONG stack thay vì cài trên máy chủ: cùng một lệnh triển khai, cùng một mạng,
  # và container khác gọi bằng tên `9router` chứ không cần biết địa chỉ máy chủ.
  #
  # Cổng NEO VÀO 127.0.0.1, không ra Internet. 9router giữ khoá API của mọi nhà cung cấp, nên nó
  # không được phép tự phơi mình ra ngoài.
  #
  # Vì sao vẫn gắn cổng thay vì để hoàn toàn trong mạng compose: nginx chạy TRÊN MÁY CHỦ, không
  # nằm trong mạng đó, nên muốn đưa bảng điều khiển ra sau một tên miền có TLS thì phải có một địa
  # chỉ ổn định để trỏ tới. Trỏ thẳng vào IP container (172.x) thì hỏng ngay lần khởi động lại đầu
  # tiên mà Docker cấp IP khác.
  #
  # Ai muốn vào phải qua nginx: TLS + mật khẩu riêng. Không có nginx thì chỉ chính máy chủ gọi
  # được, tức vẫn phải đi đường hầm SSH như trước.
  9router:
    image: ${NINE_ROUTER_IMAGE:-cmc-restaurant-9router:${DEPLOY_ENV:-local}}
    build:
      context: 9router
    restart: unless-stopped
    # BẮT BUỘC. Không có TTY thì 9router THOÁT NGAY với mã 0 — không lỗi, không cảnh báo, chỉ in
    # "Exiting..." rồi biến mất. Đo thật: `docker run -d` container chết trong vài giây;
    # `docker run -d -t` thì sống và trả HTTP 307.
    #
    # Vì nó thoát bằng mã 0 nên `restart: unless-stopped` cũng không cứu được, và nhật ký trông
    # như mọi thứ bình thường.
    tty: true
    environment:
      # Không có biến này thì 9router giữ mật khẩu mặc định `123456` và TỪ CHỐI mọi lượt đăng nhập
      # từ xa — bảng điều khiển coi như không dùng được, dù nginx đã cho qua.
      INITIAL_PASSWORD: ${NINE_ROUTER_PASSWORD:-}
    ports:
      - "127.0.0.1:${NINE_ROUTER_PORT:-20128}:20128"
    volumes:
      # ĐÚNG đường dẫn là `/root/.9router`, không phải `/app/data`.
      #
      # Gắn nhầm chỗ thì volume LUÔN RỖNG và mọi thứ 9router ghi — mật khẩu, nhà cung cấp, khoá
      # API — nằm trong lớp ghi tạm của container, tức mất sạch ở lần dựng lại kế tiếp. Hỏng theo
      # kiểu im lặng nhất: mọi thứ chạy đúng cho tới một lần triển khai bình thường.
      #
      # Đo trên máy chủ đang chạy: `/app/data` rỗng 0 byte trong khi `/root/.9router` có 30.6MB,
      # gồm `db/data.sqlite`.
      - 9router-data:/root/.9router
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:20128/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:-cmc-restaurant-frontend:${DEPLOY_ENV:-local}}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        # Trình duyệt của khách gọi các URL này, nên chúng phải là địa chỉ nhìn từ MÁY THẬT, không
        # phải tên dịch vụ trong mạng Docker: `http://api:8081` chỉ phân giải được bên trong mạng đó.
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://127.0.0.1:8081/api}
        # `/hub/orders` — đích STOMP của Spring. KHÔNG phải `/hubs/orders` của SignalR.
        VITE_ORDER_HUB_URL: ${PUBLIC_ORDER_HUB_URL:-http://127.0.0.1:8081/hub/orders}
        VITE_ORDERING_BASE_URL: ${PUBLIC_ORDERING_BASE_URL:-http://127.0.0.1:8080}
        VITE_MARKETING_BASE_URL: ${PUBLIC_MARKETING_BASE_URL:-http://127.0.0.1:8080}
        VITE_USE_MOCK_CHAT: ${VITE_USE_MOCK_CHAT:-false}
        VITE_USE_MOCK_ORDER: ${VITE_USE_MOCK_ORDER:-false}
        VITE_USE_MOCK_MENU: ${VITE_USE_MOCK_MENU:-false}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # KHÔNG neo vào 127.0.0.1 — ảnh món phải với tới được từ điện thoại.
      #
      # Đo trên máy phát triển: gọi http://<IP-LAN>:8081/api/health trả {"status":"ok"} (api neo
      # 0.0.0.0), nhưng http://<IP-LAN>:8080/menu-images/... trả "Unable to connect" vì cổng này
      # neo 127.0.0.1 — tức chỉ chính máy đó gọi được.
      #
      # Hệ quả trên app di động: thực đơn tải được nhưng MỌI Ô ẢNH TRỐNG, và không có lỗi nào để
      # lần theo. §9.10 cần kiểm thử trên thiết bị thật, nên đây là điều kiện tiên quyết.
      #
      # Đánh đổi phải biết: giao diện web (gồm cả trang vận hành) mở ra toàn mạng LAN. Đây là
      # compose CỤC BỘ cho phát triển — bản triển khai thật đứng sau nginx, không dùng file này.
      # Trên wifi lạ hoặc quán cà phê, cân nhắc tắt stack khi không dùng.
      - "${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  # Cấu hình, mật khẩu và khoá nhà cung cấp của 9router. Mất volume này là phải khai báo lại từ
  # đầu — xem ghi chú ở service về việc nó phải gắn vào `/root/.9router`.
  9router-data:
  # Volume riêng, không dùng chung với stack .NET: hai bản chạy song song phải có CSDL độc lập thì
  # so khớp hành vi ở issue #15 mới có nghĩa.
  postgres-data-java:
