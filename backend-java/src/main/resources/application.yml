server:
  port: ${BACKEND_JAVA_PORT:8081}

spring:
  application:
    name: restaurant-qr-ai-ordering-java
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:restaurant_qr}
    username: ${POSTGRES_USER:restaurant_user}
    password: ${POSTGRES_PASSWORD:restaurant_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

payments:
  vietqr:
    # No defaults on purpose (mirrors appsettings.json): an unconfigured deployment must fail with
    # VIETQR_CONFIG_MISSING rather than render a QR pointing at nobody's account.
    bank-id: ${PAYMENTS_VIETQR_BANKID:}
    account-number: ${PAYMENTS_VIETQR_ACCOUNTNUMBER:}
    account-name: ${PAYMENTS_VIETQR_ACCOUNTNAME:}
    template: ${PAYMENTS_VIETQR_TEMPLATE:compact2}
  casso:
    # No default either: an unset token makes the webhook reject every call, which is the safe
    # failure mode — accepting unauthenticated payloads would mark orders paid for free.
    secure-token: ${PAYMENTS_CASSO_SECURETOKEN:}

jwt:
  issuer: ${JWT_ISSUER:RestaurantQrAiOrdering}
  audience: ${JWT_AUDIENCE:RestaurantQrAiOrdering.Client}
  # Dev-only default so the app boots without extra setup; production MUST override via env.
  signing-key: ${JWT_SIGNING_KEY:dev-only-signing-key-change-me-before-any-real-deploy}
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
