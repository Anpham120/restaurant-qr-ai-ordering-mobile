server:
  port: ${BACKEND_JAVA_PORT:8081}
  # Tin `X-Forwarded-*` khi chạy sau nginx — tương đương `app.UseForwardedHeaders()` của bản .NET.
  #
  # `deploy/scripts/write-nginx-config.sh` CÓ đặt `X-Forwarded-For` và `X-Forwarded-Proto`, nhưng
  # Spring mặc định bỏ qua chúng. Không bật thì mọi yêu cầu đi qua proxy đều mang IP của nginx và
  # scheme `http`, kể cả khi khách vào bằng https.
  #
  # Tác động ở hệ thống này HẸP, nói rõ để không ai tưởng đây là bản vá lớn: mọi header `Location`
  # đều là URI tương đối và backend không đặt cookie nào, nên thứ thật sự sai là IP khách trong log.
  # Vẫn đáng bật, vì log sai IP là thứ chỉ phát hiện được khi đang cần tra một sự cố.
  forward-headers-strategy: framework

spring:
  application:
    name: cmc-restaurant-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:restaurant_qr}
    username: ${POSTGRES_USER:restaurant_user}
    password: ${POSTGRES_PASSWORD:restaurant_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

payments:
  vietqr:
    # No defaults on purpose (mirrors appsettings.json): an unconfigured deployment must fail with
    # VIETQR_CONFIG_MISSING rather than render a QR pointing at nobody's account.
    bank-id: ${PAYMENTS_VIETQR_BANKID:}
    account-number: ${PAYMENTS_VIETQR_ACCOUNTNUMBER:}
    account-name: ${PAYMENTS_VIETQR_ACCOUNTNAME:}
    template: ${PAYMENTS_VIETQR_TEMPLATE:compact2}
  sepay:
    # Khoá webhook SePay, gửi kèm header "Authorization: Apikey ...".
    # Để trống thì webhook TỪ CHỐI mọi lời gọi — thà không đối soát tự động còn hơn nhận một
    # thân request giả và đánh dấu đơn đã trả tiền.
    api-key: ${PAYMENTS_SEPAY_APIKEY:}

# Năng lực bếp — xem KitchenCapacityProperties. Số món bếp làm được CÙNG LÚC, dùng để đổi hàng
# đợi thành thời gian chờ. Quán tự đo rồi chỉnh; mặc định là ước lượng cho bếp cỡ vừa.
kitchen:
  parallel-dishes: ${KITCHEN_PARALLEL_DISHES:6}
  parallel-bar-items: ${KITCHEN_PARALLEL_BAR_ITEMS:2}

cors:
  # Danh sách phân tách bằng dấu phẩy. Mặc định "*" cho máy cá nhân; bản triển khai thật siết
  # lại bằng biến môi trường, không phải bằng cách dựng lại ảnh.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

firebase:
  # Xác minh số điện thoại lúc đăng ký (OTP). KHÔNG có mặc định: chưa cấu hình thì
  # FirebasePhoneClaimsRule từ chối mọi lời gọi, không nhận mọi lời gọi.
  api-key: ${FIREBASE_API_KEY:}
  project-id: ${FIREBASE_PROJECT_ID:}

google:
  # KHÔNG có mặc định. Chưa cấu hình thì GoogleClaimsRule từ chối mọi lời gọi — một triển khai
  # quên cấu hình phải từ chối tất cả, không phải nhận tất cả. Cùng luật với khoá webhook SePay.
  client-id: ${GOOGLE_CLIENT_ID:}

jwt:
  # ĐỪNG đổi hai giá trị mặc định này cho "hợp tên dự án mới". Chúng là định danh TRÊN ĐƯỜNG
  # TRUYỀN, không phải nhãn hiển thị: `JwtService` gọi `requireIssuer(...)` lúc đọc token, nên đổi
  # chuỗi là làm mọi token đang lưu hành hết hiệu lực — toàn bộ người đang đăng nhập bị đá ra.
  # Cùng lý do với `PURPOSE` trong `TableSessionCapability`.
  issuer: ${JWT_ISSUER:RestaurantQrAiOrdering}
  audience: ${JWT_AUDIENCE:RestaurantQrAiOrdering.Client}
  # Dev-only default so the app boots without extra setup; production MUST override via env.
  signing-key: ${JWT_SIGNING_KEY:dev-only-signing-key-change-me-before-any-real-deploy}
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}

# Tài khoản quản trị đầu tiên của một bản triển khai mới. Bỏ trống = không tạo gì.
#
# CỐ Ý không có mặc định cho email và mật khẩu: một cặp đặt sẵn trong mã nghĩa là mọi máy chủ chưa
# cấu hình đều có chung một tài khoản quản trị mà ai đọc mã nguồn cũng biết mật khẩu.
admin-bootstrap:
  email: ${ADMIN_BOOTSTRAP_EMAIL:}
  password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  full-name: ${ADMIN_BOOTSTRAP_FULL_NAME:}
