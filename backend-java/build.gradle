plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.cmc'
version = '0.1.0'

// Ghi đè phiên bản Testcontainers do BOM của Spring Boot 3.3.4 quản (1.19.8).
//
// Không ghi đè ở đây thì khai báo '...:1.21.3' dưới phần dependencies bị kéo ngược về 1.19.8 —
// Gradle vẫn in ra "1.21.3 -> 1.19.8" nên rất dễ tưởng là đã nâng. Bản 1.19.8 kèm docker-java
// 3.3.6, và docker-java 3.3.x thương lượng API Docker dưới mức 1.40 trong khi Docker Engine 29
// đặt MinAPIVersion = 1.40 rồi trả HTTP 400. Triệu chứng là "Could not find a valid Docker
// environment" — nghe như máy không cài Docker, dù Docker đang chạy bình thường.
ext['testcontainers.version'] = '1.21.3'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// Realtime — Spring's STOMP-over-WebSocket, replacing the .NET SignalR hub.
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// QR rendering — Java counterpart of QRCoder used by the .NET VietQrProvider.
	implementation 'com.google.zxing:core:3.5.3'
	implementation 'com.google.zxing:javase:3.5.3'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// 1.21.3 chứ không phải 1.20.2: docker-java kèm trong 1.20.x thương lượng API Docker ở mức
	// dưới 1.40, mà Docker Engine 29 đặt MinAPIVersion = 1.40 và trả thẳng HTTP 400 cho /info.
	// Triệu chứng là "Could not find a valid Docker environment" — nghe như máy không có Docker,
	// trong khi Docker vẫn chạy bình thường. Biến DOCKER_API_VERSION không cứu được vì client tự
	// kẹp lại theo mức nó hỗ trợ.
	testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
	testImplementation 'org.testcontainers:postgresql:1.21.3'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	// Giữ ranh giới tầng của §5.3 bằng test, thay vì bằng quy ước.
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
	// Gradle 9 không còn tự thêm launcher vào test runtime classpath. Thiếu dòng này thì task
	// `test` chết ngay lúc khởi động với "Failed to load JUnit Platform" — đã xảy ra thật khi
	// runner GitHub nhảy từ Gradle 8 lên 9.7.0.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// javac không cảnh báo import thừa, nên import chết tích tụ suốt hơn 20 PR mà không gì báo —
// trong đó có hai import kéo cả JPA entity vào orders/domain/Order.java, đúng thứ mà javadoc
// của chính lớp đó tuyên bố là không có. Checkstyle chạy trong `check`, tức `build` cũng chạy.
checkstyle {
	toolVersion = '10.18.2'
	maxWarnings = 0
}

// Áp cho MỌI task test, không riêng `test`: `integrationTest` cũng dùng Testcontainers, và một
// task thứ ba thêm về sau sẽ tự có mà không ai phải nhớ.
//
// Testcontainers ghim sẵn phiên bản Docker Engine API 1.32 để chạy được với Docker rất cũ. Docker
// Engine 29 đặt MinAPIVersion = 1.40 và trả HTTP 400 cho mọi lượt gọi cũ hơn, nên trên máy dùng
// Docker Desktop đời mới thì MỌI test Testcontainers chết ở bước dựng container — kèm thông báo
// "Could not find a valid Docker environment", nghe hệt như máy chưa cài Docker. Muốn thấy đúng
// nguyên nhân phải soi request thật: `GET /v1.32/info`.
//
// 1.40 ra đời cùng Docker 19.03 (2019) nên đặt cứng không loại bỏ máy nào còn dùng được, và nó
// cũng chính là mức thấp nhất Docker 29 chấp nhận. docker-java đọc khoá này từ SYSTEM PROPERTY,
// không đọc từ biến môi trường — thử DOCKER_API_VERSION hay API_VERSION đều công cốc.
tasks.withType(Test).configureEach {
	systemProperty 'api.version', '1.40'
}

tasks.named('test') {
	useJUnitPlatform()

	// Phần cần Docker tách sang `integrationTest`. Đây là lý do CI có thể chặn merge dựa trên
	// `test`: khi hai loại còn chung một task, cờ `continue-on-error` đặt cho bộ Testcontainers
	// (chưa từng chạy được ở sandbox) vô hiệu hoá luôn 82 test domain vốn không cần Docker.
	filter { excludeTestsMatching 'com.cmc.restaurant.RestaurantApplicationTests' }

	// `DeploymentConfigurationTest` đọc tệp compose, không đọc mã Java. Không khai nó là input thì
	// Gradle coi task `test` là UP-TO-DATE khi chỉ tệp compose đổi, và phép canh bất biến hết hạn
	// KHÔNG chạy lại — tức nó im lặng đúng lúc cần lên tiếng. Đã dựng lại: đảo giá trị trong compose
	// rồi chạy `test` cho ra "UP-TO-DATE", phải `--rerun-tasks` mới thấy đỏ.
	inputs.file(rootProject.file('../deploy/docker-compose.java.yml'))
			.withPropertyName('composeJava')
			.withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.register('integrationTest', Test) {
	description = 'Test cần Docker thật (Testcontainers).'
	group = 'verification'
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter { includeTestsMatching 'com.cmc.restaurant.RestaurantApplicationTests' }
}
