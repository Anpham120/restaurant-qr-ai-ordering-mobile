# ĐÃ VÔ HIỆU HOÁ Ở FORK NÀY — #59.
#
# Workflow này deploy lên VPS CHUNG của nhóm, và fork cá nhân không được phép chạm vào đó: VPS đó
# đang phục vụ điểm môn INFO2005 của 4 người khác (kế hoạch §8.1). Nó cũng dựng
# `deploy/docker-compose.yml`, tệp đã xoá cùng backend .NET.
#
# Vì sao VÔ HIỆU HOÁ chứ không VIẾT LẠI cho stack Java: viết lại nghĩa là tạo ra một đường deploy
# chạy được từ fork này tới VPS chung — đúng thứ §8.1 cấm. Không có phiên bản "an toàn" của việc đó.
#
# Vì sao KHÔNG XOÁ hẳn: §8 (môn Triển khai phần mềm) đọc chính những tệp này làm tài liệu tham
# chiếu về một pipeline thật. Xoá thì mất tài liệu; để nguyên mà còn kích hoạt thì mỗi lần merge
# vào `develop` lại thêm một lần chạy đỏ — đã xảy ra suốt, và mọi lần đều chết ở
# `Missing required variable: SSH_HOST` vì fork không có secrets. Tức nó CHƯA TỪNG tới được VPS.
#
# Chỉ còn `workflow_dispatch`: phải có người chủ động bấm, và người đó phải tự thêm secrets.
name: Deploy Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  quality-gate:
    name: quality-gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: deploy-staging
    runs-on: ubuntu-latest
    needs: quality-gate
    environment: staging
    env:
      DEPLOY_ENV: staging
      SSH_HOST: ${{ secrets.STAGING_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      COMPOSE_PROJECT_NAME: cmc-restaurant-staging
      FRONTEND_PORT: "8081"
      BACKEND_PORT: "5001"
      POSTGRES_PORT: "5433"
      POSTGRES_DB: restaurant_qr_staging
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
      FRONTEND_SERVER_NAMES: staging.cmcrestaurant.app order-staging.cmcrestaurant.app admin-staging.cmcrestaurant.app staff-staging.cmcrestaurant.app kitchen-staging.cmcrestaurant.app
      API_SERVER_NAME: api-staging.cmcrestaurant.app
      PUBLIC_API_BASE_URL: https://api-staging.cmcrestaurant.app/api
      PUBLIC_ORDERING_BASE_URL: https://order-staging.cmcrestaurant.app
      PUBLIC_MARKETING_BASE_URL: https://staging.cmcrestaurant.app
      CORS_ALLOWED_ORIGINS: https://staging.cmcrestaurant.app;https://order-staging.cmcrestaurant.app;https://admin-staging.cmcrestaurant.app;https://staff-staging.cmcrestaurant.app;https://kitchen-staging.cmcrestaurant.app
      ASPNETCORE_ENVIRONMENT: Staging
      JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
      PAYMENTS__VIETQR__BANKID: ${{ secrets.PAYMENTS__VIETQR__BANKID }}
      PAYMENTS__VIETQR__ACCOUNTNUMBER: ${{ secrets.PAYMENTS__VIETQR__ACCOUNTNUMBER }}
      PAYMENTS__VIETQR__ACCOUNTNAME: ${{ secrets.PAYMENTS__VIETQR__ACCOUNTNAME }}
      PAYMENTS__VIETQR__TEMPLATE: ${{ secrets.PAYMENTS__VIETQR__TEMPLATE }}
      RUN_DB_MIGRATIONS_ON_STARTUP: "false"
      CHAT_AI_PROVIDER: python-rag
      AI_SERVICE_URL: http://127.0.0.1:8001
      AI_SERVICE_PORT: "8001"
      AI_INTERNAL_TOKEN: ${{ secrets.AI_INTERNAL_TOKEN }}
      LLM_BASE_URL: ${{ vars.NINE_ROUTER_BASE_URL || 'http://127.0.0.1:20128/v1' }}
      LLM_API_KEY: ${{ secrets.NINE_ROUTER_API_KEY }}
      LLM_MODEL: cx/gpt-5.6-luna-review
      # 30 giây, và phải nhỏ hơn BACKEND_AI_TIMEOUT_SECONDS (50) để backend còn nhận được câu
      # thoái hóa thay vì tự hết hạn trước.  DeploymentConfigurationTests canh quan hệ đó.
      LLM_TIMEOUT_SECONDS: "30"
      # Bảy biến vừa RA khỏi khối này: LLM_PROVIDER, LLM_RATE_LIMIT_FALLBACK_MODEL,
      # LLM_RATE_LIMIT_FALLBACK_ENABLED, AI_REQUEST_BUDGET_SECONDS, AI_PIPELINE_PROFILE,
      # RAG_TOP_K, RAG_RETRIEVAL_METHOD, AI_LLM_FIRST.
      #
      # Không mô-đun nào của bản dựng lại đọc chúng, và ba cái nói SAI về hệ thống:
      # RAG_RETRIEVAL_METHOD nói `hybrid` trong khi bộ truy hồi thật là `embedding` (và nó do
      # requirements.txt quyết định, không do biến); AI_LLM_FIRST nói về một khái niệm không còn.
      #
      # AI_PIPELINE_PROFILE là cái nguy hiểm nhất, nên nó phải đi: ChatAiProvider.ReadPipelineProfile()
      # NÉM LỖI với mọi giá trị không thuộc ba tên profile cũ.  Đặt cho nó một tên của hệ thống mới
      # là làm sập mọi lượt chat.  Không truyền thì hàm đó trả mặc định và không bao giờ ném.
      #
      # `ai/app/test_packaging.py::ComposeChiTruyenBienDichVuTHATSUDoc` canh khối tương ứng trong
      # docker-compose theo CẢ HAI chiều, nên biến chết không quay lại được mà không ai thấy.
      BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.STAGING_BOOTSTRAP_ADMIN_EMAIL || '' }}
      BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.STAGING_BOOTSTRAP_ADMIN_PASSWORD || '' }}
      SEED_DEMO_USERS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for research artifact verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CỔNG DEPLOY: cấu hình sắp dựng có khớp cấu hình mà phép đo đã chạy trên đó không?
      #
      # Thay cho `verify_pipeline_selection.py` của hệ thống cũ — cùng mục đích ("fail closed khi
      # cấu hình runtime trôi khỏi bản nghiên cứu đã duyệt"), nhưng bản cũ đọc `PIPELINE_PROFILES`,
      # một khái niệm bản dựng lại đã bỏ. Tệp đó nay không còn, nên bước này TỪNG sẽ thất bại.
      #
      # Cổng mới đối chiếu `ai/evaluation/measurements/golden_e2e*.json` — bản ghi lần chạy golden qua
      # HTTP thật, mang nguyên phản hồi `/ready` lúc đo — với cấu hình sắp deploy. Nó CHẶN khi bộ truy
      # hồi lệch, khi đường sinh lệch, hoặc khi lần đo gần nhất còn lượt đỏ.
      #
      # Nó KHÔNG chạy lại golden: việc đó cần cả stack và một khóa mô hình thật.
      - name: Cổng deploy — cấu hình phải khớp bằng chứng đã đo
        run: python ai/evaluation/verify_deploy_config.py --moi-truong staging

      - name: Tải lên bằng chứng đo (để lần deploy nào cũng truy được số của nó)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bang-chung-do-staging-${{ github.sha }}
          path: ai/evaluation/measurements/
          if-no-files-found: error

      - name: Deploy to staging VPS
        run: bash deploy/scripts/deploy-vps.sh

      - name: Deployment summary
        run: |
          {
            echo "## Staging deployment"
            echo "- Frontend: https://staging.cmcrestaurant.app"
            echo "- Table ordering: https://order-staging.cmcrestaurant.app"
            echo "- Admin portal: https://admin-staging.cmcrestaurant.app"
            echo "- Staff portal: https://staff-staging.cmcrestaurant.app"
            echo "- Kitchen board: https://kitchen-staging.cmcrestaurant.app"
            echo "- API health: https://api-staging.cmcrestaurant.app/api/health"
            echo "- AI smoke: included in deploy health-check (/ready + /v1/chat)"
            echo "- AI retriever: $(python ai/evaluation/verify_deploy_config.py --chi-bo-truy-hoi)"
            echo "- Runbook: docs/ai/VPS_STAGING_AI_RUNBOOK.md"
            echo "- Result: workflow reached post-deploy summary"
          } >> "$GITHUB_STEP_SUMMARY"
