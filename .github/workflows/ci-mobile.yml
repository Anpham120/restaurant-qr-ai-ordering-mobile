# CI cho ứng dụng Flutter (fork cá nhân — môn Lập trình ứng dụng di động, §9).
#
# File MỚI, cố ý không đụng `ci.yml` gốc: workflow đó đang phục vụ điểm môn INFO2005 của 4 người
# khác (§8.1).
name: ci-mobile

on:
  push:
    branches: [develop, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
  # KHÔNG lọc `paths` cho `pull_request`, cùng lý do đã ghi ở `ci-java.yml`: nếu sau này
  # `mobile-build` được đặt làm required check, một PR không đụng `mobile/` sẽ treo PENDING
  # vĩnh viễn vì GitHub coi check bắt buộc không chạy là chưa xong, không phải là bỏ qua.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # `pubspec.lock` được commit (đây là ứng dụng, không phải thư viện). `--enforce-lockfile`
      # bắt CI dùng ĐÚNG các phiên bản trong lock thay vì tự giải lại phụ thuộc.
      #
      # Không có cờ này thì một bản vá của thư viện bên thứ ba có thể làm CI đỏ (hoặc tệ hơn:
      # xanh với mã khác) mà không ai đổi một dòng nào trong repo — và cổng chặn xanh hôm nay
      # không nói được gì về bản build ngày mai.
      - name: Cài phụ thuộc đúng theo lockfile
        run: flutter pub get --enforce-lockfile

      - name: Kiểm định dạng mã
        run: dart format --output=none --set-exit-if-changed .

      # `--fatal-infos`: mức `info` của Dart bao gồm cả cảnh báo lint thật (biến không dùng,
      # await bị quên). Để mặc định thì chúng chỉ in ra rồi trôi qua, và cổng này thành trang trí.
      - name: Phân tích tĩnh
        run: flutter analyze --fatal-infos

      - name: Chạy test
        run: flutter test

      # Build APK debug — đủ để chứng minh mã biên dịch được cho Android thật. Không build
      # release: cần khoá ký, và khoá ký không được nằm trong repo.
      - name: Build APK (debug)
        run: flutter build apk --debug
