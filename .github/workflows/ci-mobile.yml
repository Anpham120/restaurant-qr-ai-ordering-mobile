# CI cho ứng dụng Flutter (fork cá nhân — môn Lập trình ứng dụng di động, §9).
#
# File MỚI, cố ý không đụng `ci.yml` gốc: workflow đó đang phục vụ điểm môn INFO2005 của 4 người
# khác (§8.1).
name: ci-mobile

on:
  push:
    branches: [develop, main]
    paths:
      - 'mobile/**'
      - 'mobile-rn/**'
      - '.github/workflows/ci-mobile.yml'
  # KHÔNG lọc `paths` cho `pull_request`, cùng lý do đã ghi ở `ci-java.yml`: nếu sau này
  # `mobile-build` được đặt làm required check, một PR không đụng `mobile/` sẽ treo PENDING
  # vĩnh viễn vì GitHub coi check bắt buộc không chạy là chưa xong, không phải là bỏ qua.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # GHIM PHIÊN BẢN, không dùng `channel: stable`.
      #
      # Lý do là một lần đỏ thật ở PR #125, không phải đề phòng lý thuyết. Bốn gói `matcher`,
      # `meta`, `test_api`, `vector_math` KHÔNG đến từ pub.dev — chính SDK Flutter ghim chúng.
      # Nên khi `stable` nhích từ 3.44.0 (bản sinh ra lockfile) lên 3.47.1, bước sau đỏ ngay:
      #
      #     Unable to satisfy `pubspec.yaml` using `pubspec.lock`.
      #     > vector_math 2.4.2 (was 2.2.0)
      #
      # `channel: stable` là mục tiêu DI ĐỘNG, còn `--enforce-lockfile` đòi mục tiêu cố định —
      # hai thứ không thể cùng đúng. Bỏ `--enforce-lockfile` sẽ làm CI xanh trở lại nhưng biến
      # lockfile thành đồ trang trí: mỗi lần chạy có thể giải ra phiên bản khác mà không ai đổi
      # một dòng nào trong repo.
      #
      # Ghim ở đây nghĩa là nâng Flutter trở thành MỘT COMMIT CÓ CHỦ Ý sửa cả hai nơi cùng lúc.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Phải khớp SDK đã sinh `mobile/pubspec.lock`. Đổi số này thì chạy lại
          # `flutter pub get` và commit lockfile mới trong cùng commit.
          flutter-version: 3.47.1
          channel: stable
          cache: true

      # `pubspec.lock` được commit (đây là ứng dụng, không phải thư viện). `--enforce-lockfile`
      # bắt CI dùng ĐÚNG các phiên bản trong lock thay vì tự giải lại phụ thuộc.
      #
      # Không có cờ này thì một bản vá của thư viện bên thứ ba có thể làm CI đỏ (hoặc tệ hơn:
      # xanh với mã khác) mà không ai đổi một dòng nào trong repo — và cổng chặn xanh hôm nay
      # không nói được gì về bản build ngày mai.
      - name: Cài phụ thuộc đúng theo lockfile
        run: flutter pub get --enforce-lockfile

      - name: Kiểm định dạng mã
        run: dart format --output=none --set-exit-if-changed .

      # `--fatal-infos`: mức `info` của Dart bao gồm cả cảnh báo lint thật (biến không dùng,
      # await bị quên). Để mặc định thì chúng chỉ in ra rồi trôi qua, và cổng này thành trang trí.
      - name: Phân tích tĩnh
        run: flutter analyze --fatal-infos

      - name: Chạy test
        run: flutter test

      # Build APK debug — đủ để chứng minh mã biên dịch được cho Android thật. Không build
      # release: cần khoá ký, và khoá ký không được nằm trong repo.
      - name: Build APK (debug)
        run: flutter build apk --debug

      # GIỮ LẠI APK để cài lên máy thật.
      #
      # §9.10 yêu cầu kiểm thử trên thiết bị thật và chụp bằng chứng ở mỗi pha. Máy phát triển
      # của dự án dựng APK KHÔNG NỔI: Docker chỉ có 3,6 GB còn Gradle mặc định của Flutter xin
      # -Xmx8G, và bản dựng chết giữa chừng hai lần. Runner ở đây có 16 GB và đã dựng xong —
      # chỉ là trước giờ vứt đi ngay sau đó.
      #
      # Bản DEBUG, không ký. Đủ để cài qua USB hoặc tải thẳng vào máy; KHÔNG dùng để phát hành.
      - name: Giữ lại APK để cài lên máy thật
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # iOS phải có runner riêng: dựng iOS bắt buộc macOS + Xcode, không có cách nào chạy trên
  # ubuntu. Đây KHÔNG phải giới hạn của Flutter — mã Dart giống hệt nhau; chỉ khâu biên dịch
  # cuối và CocoaPods là của Apple.
  #
  # Trước đây tôi ghi "CI chỉ dựng Android" như thể đó là sự thật cố định. Nó không cố định:
  # repo này PUBLIC, mà runner macOS của GitHub miễn phí cho repo public. Lý do duy nhất iOS
  # chưa có cổng chặn là chưa ai thêm job — không phải vì không làm được.
  #
  # Tách job thay vì thêm bước vào `mobile-build`: hai runner khác hệ điều hành, và gộp lại
  # nghĩa là mỗi PR phải chờ macOS ngay cả khi chỉ cần biết Android còn dựng được.
  mobile-build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Phải khớp job Android và `mobile/pubspec.lock` — xem ghi chú ở trên.
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Cài phụ thuộc đúng theo lockfile
        run: flutter pub get --enforce-lockfile

      # `--no-codesign`: dựng để CHỨNG MINH MÃ BIÊN DỊCH ĐƯỢC, không phải để phát hành.
      #
      # Ký cần chứng chỉ Apple Developer, và chứng chỉ đó không được nằm trong repo — cùng lý do
      # job Android chỉ dựng bản debug. Bỏ khâu ký vẫn chạy trọn phần dễ hỏng nhất: CocoaPods
      # phân giải pod của `flutter_secure_storage`, rồi Xcode biên dịch toàn bộ mã Dart + Swift.
      #
      # KHÔNG đặt `continue-on-error`. Một cổng không chặn được thì không phải cổng.
      - name: Build iOS (không ký)
        run: flutter build ios --debug --no-codesign

  # Bản React Native (#145). Chạy SONG SONG với hai job Flutter ở trên, không thay thế chúng:
  # báo cáo môn có khối sinh tự động từ số liệu Flutter với cổng --check, và artifact APK là bằng
  # chứng §9.10. Xoá Flutter là việc riêng, làm sau khi đối chiếu xong.
  mobile-rn-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-rn
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json

      # `npm ci` chứ không `npm install`: cài đúng theo lockfile và HỎNG nếu lockfile lệch
      # package.json. Cùng tinh thần với `--enforce-lockfile` ở job Flutter — một bản dựng CI
      # âm thầm nâng phiên bản là bản dựng không nói lên điều gì về mã đang xét.
      - name: Cài phụ thuộc đúng theo lockfile
        run: npm ci

      - name: Kiểm định dạng mã
        run: npm run format:check

      # Tương đương `flutter analyze --fatal-infos`: cảnh báo cũng làm đỏ. Ở bản Flutter, chính
      # mức nghiêm này bắt được lỗi `prefer_final_fields` khiến nút huỷ món không bao giờ hiện.
      - name: Lint
        run: npm run lint

      - name: Kiểm kiểu
        run: npm run typecheck

      - name: Chạy test
        run: npm test
