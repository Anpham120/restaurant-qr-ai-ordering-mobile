name: CI

on:
  pull_request:
  push:
    # CHỈ hai nhánh đích. Nhánh tính năng cố ý KHÔNG có ở đây.
    #
    # Trước đây danh sách này còn `feat/** fix/** chore/** rebuild/**`, và vì mọi PR đều đến từ một
    # trong số đó nên **mỗi lần đẩy chạy CI hai lần** — một lần do `push`, một lần do `pull_request`.
    # Đo được trên PR #385:
    #
    #     pull_request  success  12ace33  07:16:47
    #     push          success  12ace33  07:16:43     <- cùng commit, cùng job, chạy lại từ đầu
    #
    # Gấp đôi mọi thứ, và job đắt nhất là `golden-e2e`: nó dựng ảnh Docker 2,75GB có `torch`.
    #
    # Việc này đắt hơn kể từ khi `menu-data` và `golden-e2e` thành check BẮT BUỘC.
    #
    # Đánh đổi phải nói rõ: đẩy một nhánh mà CHƯA mở PR thì không có CI. Chấp nhận được vì mọi thay
    # đổi đều đi qua PR (`main` và `develop` đều bị ruleset chặn push thẳng), và đây là nếp chuẩn.
    branches:
      - develop
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref so pushes don't pile up runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend regression tests
        run: npm test

      - name: Build frontend
        run: npm run build

  # Job `backend-test` (.NET) ĐÃ GỠ — #58.
  #
  # Backend đã chuyển hẳn sang Java, và `ci-java.yml` đã chạy đúng phần việc đó: build, Checkstyle,
  # test domain + kiến trúc (ArchUnit), và test tích hợp bằng Testcontainers trên Postgres thật.
  # Giữ lại job .NET ở đây sẽ tốn thêm một runner để kiểm một backend sắp bị xoá (#59), và tệ hơn:
  # nó khiến bảng check trông như thể hệ thống vẫn có hai backend được bảo chứng.
  #
  # Đã kiểm trước khi gỡ: check BẮT BUỘC của nhánh `develop` là `backend-java-build`, KHÔNG phải
  # `backend-test`. Gỡ một job đang là required check sẽ làm mọi PR treo PENDING vĩnh viễn — GitHub
  # coi check bắt buộc không chạy là chưa xong, không phải là bỏ qua.

  # Đổi tên từ `ai-data-and-eval` sau khi gỡ trợ lý AI. Kiểm trước khi đổi: kho này không bật
  # required status checks trên nhánh nào, nên việc đổi tên không làm PR treo — đúng cái bẫy mà
  # ghi chú ngay trên đã cảnh báo.
  menu-data:
    name: menu-data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Job này TỪNG tên `ai-data-and-eval` và chạy thêm kho tri thức, đóng gói, thống kê và bộ
      # test dịch vụ HTTP của trợ lý. Trợ lý đã gỡ khỏi hệ thống, nên những bước đó đi theo.
      #
      # Năm bước còn lại KHÔNG phải AI: chúng sinh và soát bộ nhãn thực đơn. `data/menu-tags.json`
      # được giao diện khách dùng, và nhãn `method:` là thứ cụm ước lượng thời gian lên món dựa vào
      # để chia trạm bếp — nên chúng ở lại, và chuyển sang `scripts/menu-tags/` cho đúng chỗ.
      #
      # Bộ sinh chỉ dùng thư viện chuẩn — không cần cài gì.

      # Chạy ở chế độ --check: nếu tệp đã commit khác kết quả sinh lại thì đỏ, tức có ai
      # sửa tay dữ liệu mà không chạy lại bộ sinh.
      - name: Kiểm từ điển nhãn và thực đơn sinh lại được
        run: python scripts/menu-tags/build_tag_dictionary.py --check

      # Nhãn đổi thì cơ sở dữ liệu ĐANG CHẠY phải được cập nhật bằng một migration MỚI.
      - name: Kiểm nhãn cơ sở dữ liệu khớp thực đơn
        run: python scripts/menu-tags/build_tag_migration.py --check

      - name: Rà nhãn dị nguyên
        run: python scripts/menu-tags/audit_allergen_tags.py

      - name: Rà nhãn mùa
        run: python scripts/menu-tags/audit_season_tags.py

      # Nhóm nhãn duy nhất mà TÊN món tự nói ra đáp án, nên soát được bằng máy.
      - name: Rà nhãn cách chế biến
        run: python scripts/menu-tags/audit_method_tags.py --check

      - name: Kiểm chỉ mục tài liệu khớp thư mục
        run: python docs/build_docs_index.py --check

  golden-e2e:
    name: golden-e2e
    runs-on: ubuntu-latest
    # Dựng stack THẬT rồi hỏi như khách: QR -> phiên bàn -> phiên chat -> backend Java ->
    # dịch vụ AI -> câu trả lời -> thẻ giỏ -> giỏ hàng thật.
    #
    # Vì sao job này tồn tại: mọi tập khác dừng ở một chặng khác nhau của chuỗi gọi, và cả
    # `test_service.py` lẫn `ChatAiProviderV2ContractTests` đều tự nhất quán với chính mình —
    # nên khung SSE của hai bên lệch nhau suốt mà không tập nào đỏ. Khách nhận "Xin lỗi, hệ
    # thống hơi chậm." trên ĐƯỜNG CHÍNH (frontend gọi stream trước rồi mới lùi về gọi thường).
    #
    # KHÔNG cần bí mật thật. `LLM_BASE_URL` trỏ vào cổng không có gì lắng nghe, nên mô hình gọi
    # thất bại ngay và dịch vụ trả lời bằng mã tất định — đúng đường đã đạt 140/140 ca.
    #
    # Và KHÔNG đặt `AI_ENABLE_GENERATION` ở đây, có chủ ý: job này phải đo đường TẤT ĐỊNH. Đường sinh
    # cần mô hình thật, và một job CI không có mô hình mà bật đường sinh chỉ đo phần lùi về khuôn mẫu.
    #
    # CHI PHÍ ĐÃ ĐỔI: ảnh AI nay có tầng embedding, nên bước dựng tải `torch` bản CPU (~200MB) và mô
    # hình `BAAI/bge-m3` (~2,2GB), rồi tính sẵn vector cho 372 đoạn. Con số mô hình vừa tăng từ
    # ~500MB của `multilingual-e5-small` sau khi phép đo ghép cặp trên 148 câu cho `bge-m3` hơn có ý
    # nghĩa thống kê (McNemar p = 0,0351). Job vẫn trong hạn mặc định của GitHub Actions, nhưng con
    # số này đáng biết trước khi ai đó hỏi vì sao CI chậm hơn.
    env:
      DEPLOY_ENV: ci
      COMPOSE_PROJECT_NAME: cmc-restaurant-golden
      FRONTEND_PORT: "8080"
      # Backend Java nghe 8081, không phải 5000 của bản .NET (#58).
      # `deploy/docker-compose.java.yml` publish theo BACKEND_JAVA_PORT.
      BACKEND_JAVA_PORT: "8081"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: restaurant_qr_golden
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: ci-postgres-placeholder
      FRONTEND_SERVER_NAMES: cmcrestaurant.app
      API_SERVER_NAME: api.cmcrestaurant.app
      PUBLIC_API_BASE_URL: http://127.0.0.1:8081/api
      PUBLIC_ORDERING_BASE_URL: http://127.0.0.1:8080
      PUBLIC_MARKETING_BASE_URL: http://127.0.0.1:8080
      JWT_SIGNING_KEY: ci-placeholder-signing-key-change-me
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8080
      # Đường tạo tài khoản qua API đã bị bỏ: /api/auth/register giờ CHỈ nhận phoneIdToken
      # (đăng ký bằng OTP), nên CI không tự tạo được người dùng bằng email nữa. Dùng chính
      # AdminBootstrap — cơ chế mà mọi bản triển khai thật đang dùng để có tài khoản đầu tiên.
      ADMIN_BOOTSTRAP_EMAIL: ci-admin@local.test
      ADMIN_BOOTSTRAP_PASSWORD: MatKhauCI12345
      ADMIN_BOOTSTRAP_FULL_NAME: CI Admin
      # Tên biến theo convention Spring Boot, không phải hai gạch dưới của .NET (#58).
      PAYMENTS_VIETQR_BANKID: "970436"
      PAYMENTS_VIETQR_ACCOUNTNUMBER: "ci-placeholder-account"
      PAYMENTS_VIETQR_ACCOUNTNAME: CMC CI
      # Stack Java dùng mạng bridge, nên backend gọi dịch vụ AI qua TÊN DỊCH VỤ. Bản .NET dùng
      # `network_mode: host` nên nó gọi được 127.0.0.1 — chép nguyên sang đây thì backend gọi vào
      # chính container của nó và chat rơi vào câu dự phòng mà golden vẫn xanh.
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_PORT: "8001"
      AI_INTERNAL_TOKEN: ci-internal-token-placeholder
      LLM_BASE_URL: http://127.0.0.1:20128/v1
      LLM_API_KEY: ci-provider-key-placeholder
      LLM_MODEL: cx/gpt-5.6-luna-review
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bộ chạy golden chỉ dùng thư viện chuẩn — không cài gì.

      - name: Di trú cơ sở dữ liệu
        run: |
          docker compose -f deploy/docker-compose.java.yml --profile migrate run --rm migrate

      - name: Dựng postgres, dịch vụ AI, backend
        run: |
          docker compose -f deploy/docker-compose.java.yml up -d --build postgres ai-service api

      - name: Chờ backend và dịch vụ AI sẵn sàng
        run: python ai/evaluation/wait_for_stack.py --api http://127.0.0.1:8081

      - name: Golden đầu-cuối — hỏi như khách thật
        run: |
          QR=$(docker compose -f deploy/docker-compose.java.yml exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A \
            -c "select qr_token from restaurant_tables order by table_code limit 1;" | tr -d '\r')
          test -n "$QR" || { echo "không lấy được mã QR — cơ sở dữ liệu chưa seed bàn nào"; exit 1; }
          GOLDEN_QR_TOKEN="$QR" python ai/evaluation/run_golden_e2e.py --api http://127.0.0.1:8081 --chi-tiet

      # Ba câu thử của phép kiểm sức khỏe deploy, chạy Ở ĐÂY thay vì chờ tới staging.
      #
      # Vì sao bước này tồn tại: `deploy/scripts/health-check.sh` chỉ chạy trên staging, tức chỉ đỏ
      # SAU khi đã merge, đã đẩy, đã dựng ảnh và đã thay container — vòng phản hồi dài nhất của dự
      # án. Nó đã đỏ hai lần liên tiếp, và lần thứ hai đáng nói: khách hỏi "có PHỞ không" mà thẻ giỏ
      # có 4 món BÚN, trong khi **103 lượt golden, 140 ca và 87 lượt phiên đều xanh** trên đúng bản
      # đó. Ba câu thử kia tồn tại từ hệ thống CŨ, do người khác viết cho mục đích khác, nên chúng
      # hỏi khác đi — và chính vì thế chúng bắt được thứ ba tập kia không bắt.
      #
      # Bộ này KHÔNG sao chép phép khẳng định: nó bóc các khối Python nội tuyến từ chính
      # `health-check.sh` rồi chạy lại nguyên văn. Sao chép thì nó thành đầu thứ hai của cùng một bất
      # biến, và dự án đã trả giá tám lần cho đúng chuyện đó.
      # Realtime là mắt xích DUY NHẤT của chuỗi mà golden không đi qua: golden hỏi và đặt món bằng
      # HTTP, còn bếp/quầy nhận cập nhật bằng WebSocket.
      #
      # Vì sao bước này tồn tại: frontend dùng SignalR suốt thời gian backend đã chuyển sang STOMP.
      # Hai giao thức không nói chuyện được với nhau, nên MỌI tính năng realtime im lặng chết — và
      # không tập nào đỏ, vì test backend kiểm STOMP bằng client STOMP, test frontend là unit test
      # đọc mã, còn golden chỉ đi HTTP. Bước này nối đúng hai đầu đó lại: mã client THẬT của
      # frontend, nói với backend THẬT đang chạy.
      #
      # Test tự bỏ qua khi thiếu biến môi trường (`describe.runIf`), nên nó không làm `npm test`
      # thường đỏ — nhưng ở ĐÂY thì biến có đủ, tức nó thật sự chạy chứ không phải một test bị bỏ
      # qua vĩnh viễn.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Realtime đầu-cuối — client frontend thật nói với backend thật
        run: |
          set -euo pipefail
          npm --prefix frontend ci --silent

          psql_q() {
            docker compose -f deploy/docker-compose.java.yml exec -T postgres \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -t -A -c "$1" | tr -d '\r'
          }

          export LIVE_HUB_URL=http://127.0.0.1:8081/hub/orders
          export LIVE_API_URL=http://127.0.0.1:8081
          export LIVE_TABLE_CODE=T01
          export LIVE_QR_TOKEN=$(psql_q "select qr_token from restaurant_tables where table_code='T01';")
          test -n "$LIVE_QR_TOKEN" || { echo "không đọc được mã QR của bàn T01"; exit 1; }

          SESSION=$(curl -sS -X POST "$LIVE_API_URL/api/table-sessions" \
            -H 'Content-Type: application/json' \
            -d "{\"qrToken\":\"$LIVE_QR_TOKEN\",\"tableCode\":\"$LIVE_TABLE_CODE\"}")
          export LIVE_SESSION_ID=$(printf '%s' "$SESSION" | sed -n 's/.*"sessionId":"\([^"]*\)".*/\1/p')
          export LIVE_SESSION_TOKEN=$(printf '%s' "$SESSION" | sed -n 's/.*"tableSessionToken":"\([^"]*\)".*/\1/p')
          test -n "$LIVE_SESSION_TOKEN" || { echo "không mở được phiên bàn: $SESSION"; exit 1; }

          # Tài khoản nhân viên cho hai ca cần quyền vận hành.
          #
          # Vai `Staff` chứ không phải `Kitchen`, và đây là điều đã học bằng cách làm sai: `Kitchen`
          # CHỈ được chuyển một đơn `Ready` sang `Served` (`KITCHEN_ORDER_STATUS_FORBIDDEN`), nên ca
          # đổi trạng thái đơn đỏ vì phân quyền chứ không vì realtime.
          # Tài khoản do AdminBootstrap tạo sẵn lúc backend khởi động — không gọi /auth/register
          # nữa: đường đó giờ CHỈ nhận phoneIdToken.
          psql_q "update users set role='Staff' where email='ci-admin@local.test';" >/dev/null
          export LIVE_STAFF_TOKEN=$(curl -sS -X POST "$LIVE_API_URL/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"identifier":"ci-admin@local.test","password":"MatKhauCI12345"}' \
            | sed -n 's/.*"accessToken":"\([^"]*\)".*/\1/p')
          test -n "$LIVE_STAFF_TOKEN" || { echo "không đăng nhập được tài khoản nhân viên"; exit 1; }

          npm --prefix frontend exec -- vitest run packages/realtime-client/src/liveRealtime.integration.test.ts

      - name: Ba câu thử của phép kiểm deploy — bắt ở CI, không chờ staging
        run: python ai/evaluation/run_deploy_probes.py

      - name: Log khi đỏ
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.java.yml logs --tail 200 api
          docker compose -f deploy/docker-compose.java.yml logs --tail 100 ai-service

      - name: Hạ stack
        if: always()
        run: docker compose -f deploy/docker-compose.java.yml down -v

  docker-compose-config:
    name: docker-compose-config
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ci
      COMPOSE_PROJECT_NAME: cmc-restaurant-ci
      FRONTEND_PORT: "8080"
      BACKEND_JAVA_PORT: "8081"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: restaurant_qr_ci
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: ci-postgres-placeholder
      FRONTEND_SERVER_NAMES: cmcrestaurant.app order.cmcrestaurant.app admin.cmcrestaurant.app staff.cmcrestaurant.app kitchen.cmcrestaurant.app
      API_SERVER_NAME: api.cmcrestaurant.app
      PUBLIC_API_BASE_URL: https://api.cmcrestaurant.app/api
      PUBLIC_ORDERING_BASE_URL: https://order.cmcrestaurant.app
      PUBLIC_MARKETING_BASE_URL: https://cmcrestaurant.app
      JWT_SIGNING_KEY: ci-placeholder-signing-key-change-me
      CORS_ALLOWED_ORIGINS: https://cmcrestaurant.app;https://order.cmcrestaurant.app;https://admin.cmcrestaurant.app;https://staff.cmcrestaurant.app;https://kitchen.cmcrestaurant.app
      PAYMENTS_VIETQR_BANKID: "970436"
      PAYMENTS_VIETQR_ACCOUNTNUMBER: "ci-placeholder-account"
      PAYMENTS_VIETQR_ACCOUNTNAME: CMC CI
      AI_SERVICE_URL: http://127.0.0.1:8001
      AI_SERVICE_PORT: "8001"
      AI_INTERNAL_TOKEN: ci-internal-token-placeholder
      LLM_BASE_URL: http://127.0.0.1:20128/v1
      LLM_API_KEY: ci-provider-key-placeholder
      LLM_MODEL: cx/gpt-5.6-luna-review
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose -f deploy/docker-compose.java.yml config
