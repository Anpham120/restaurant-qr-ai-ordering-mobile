name: Security

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  schedule:
    # Weekly full scan (Mondays 02:00 UTC) to catch newly disclosed CVEs.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          # `csharp` ĐÃ GỠ cùng `backend/` (#59) — không còn tệp .cs nào để quét, và CodeQL báo lỗi
          # chứ không bỏ qua khi một ngôn ngữ trong ma trận không có mã.
          #
          # `java-kotlin` KHÔNG thay vào chỗ đó ở PR này, có chủ đích: quét Java cần bước build
          # (CodeQL phải biên dịch), tức thêm một lần `gradle build` nữa vào mỗi PR bên cạnh
          # `backend-java-build` đã có. Đó là một quyết định về chi phí CI, đáng bàn riêng chứ
          # không ghép vào một PR xoá — ghi thành issue.
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # No compilation needed: scan source directly for every language.
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # `dependency-review` đã CHUYỂN sang `.github/workflows/dependency-review.yml`.
  #
  # Nó chỉ chạy được trên pull request (cần nhánh gốc để so danh sách phụ thuộc), nên khi nằm ở đây
  # nó phải tự loại mình bằng `if: pull_request` — và mỗi PR hiện một dòng
  # `Security / dependency-review (push)` màu xám "Skipped" cạnh dòng đã pass. Đọc như thể có phép
  # kiểm an ninh không chạy.
  #
  # Tách ra một workflow chỉ kích trên PR thì không còn dòng skip nào, và ý nghĩa của "skipped"
  # được giữ lại cho lúc nó thật sự đáng lo.

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  trivy-fs:
    name: trivy-filesystem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan filesystem for vulnerabilities, secrets & misconfigurations
        run: >-
          trivy fs
          --scanners vuln,secret,misconfig
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --no-progress
          --exit-code 1
          .
