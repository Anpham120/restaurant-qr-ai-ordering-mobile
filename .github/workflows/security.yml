name: Security

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  schedule:
    # Weekly full scan (Mondays 02:00 UTC) to catch newly disclosed CVEs.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          # `csharp` ĐÃ GỠ cùng `backend/` (#59) — không còn tệp .cs nào để quét, và CodeQL báo lỗi
          # chứ không bỏ qua khi một ngôn ngữ trong ma trận không có mã.
          #
          # `java-kotlin` THÊM VÀO sau khi ĐO (#111). Ba con số quyết định:
          #
          #   1. Thời gian: 2 phút 31 giây, và `build-mode: none` DÙNG ĐƯỢC cho Java.
          #      Ghi chú cũ ở chính chỗ này nói "quét Java cần bước build, tức thêm một lần
          #      `gradle build` nữa mỗi PR" — ĐIỀU ĐÓ SAI. CodeQL quét Java được mà không cần
          #      biên dịch, nên chi phí thật là 2m31s chạy SONG SONG với hai ngôn ngữ kia. Lập
          #      luận cũ được viết ra mà không đo, và nó suýt loại bỏ một cổng có ích.
          #
          #   2. Nó bắt được gì mà cổng khác không: trên mã .NET cũ, CodeQL tìm ra **18 lỗi
          #      `cs/log-forging` (CWE-117)** — dựng dòng log từ dữ liệu người dùng chưa lọc.
          #      Không test nào của bản .NET đỏ vì chuyện đó, dù chính nó có sẵn một
          #      `LogSanitizer` và dùng ở đúng 2 chỗ. Tức nó thấy 18 chỗ mà con người dựng ra
          #      hàng rào rồi quên dùng — thứ không phép kiểm nào khác trong kho này nhìn ra.
          #
          #   3. Trên mã Java hiện tại: **0 cảnh báo**. Không phải vì công cụ vô dụng, mà vì bản
          #      Java gần như không ghi log dữ liệu người dùng (đã soát tay khi kiểm tính đầy đủ).
          #      Giữ nó là giữ lưới cho mã VIẾT SAU, không phải để dọn mã hiện tại.
          #
          # Vì sao chạy mỗi PR chứ không theo lịch: 2m31s chạy song song là rẻ, và một cảnh báo
          # bảo mật đến SAU khi đã merge thì đắt hơn nhiều so với đến trước.
          #
          # `trivy-filesystem` và `dependency-review` phủ phần PHỤ THUỘC. CodeQL phủ phần khác
          # hẳn: luồng dữ liệu trong mã tự viết. Hai thứ không thay thế nhau.
          - java-kotlin
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # No compilation needed: scan source directly for every language.
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # `dependency-review` đã CHUYỂN sang `.github/workflows/dependency-review.yml`.
  #
  # Nó chỉ chạy được trên pull request (cần nhánh gốc để so danh sách phụ thuộc), nên khi nằm ở đây
  # nó phải tự loại mình bằng `if: pull_request` — và mỗi PR hiện một dòng
  # `Security / dependency-review (push)` màu xám "Skipped" cạnh dòng đã pass. Đọc như thể có phép
  # kiểm an ninh không chạy.
  #
  # Tách ra một workflow chỉ kích trên PR thì không còn dòng skip nào, và ý nghĩa của "skipped"
  # được giữ lại cho lúc nó thật sự đáng lo.

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  trivy-fs:
    name: trivy-filesystem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan filesystem for vulnerabilities, secrets & misconfigurations
        run: >-
          trivy fs
          --scanners vuln,secret,misconfig
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --no-progress
          --exit-code 1
          .
