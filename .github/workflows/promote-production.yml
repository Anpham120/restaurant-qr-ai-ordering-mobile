# ĐÃ VÔ HIỆU HOÁ Ở FORK NÀY — #59. Xem chú thích đầu `deploy-staging.yml`.
#
# Bỏ `workflow_run` chứ không chỉ dựa vào việc `Deploy Staging` đã tắt trigger tự động: workflow đó
# vẫn chạy được bằng `workflow_dispatch`, và nếu ai bấm nó thì workflow này sẽ TỰ ĐỘNG chạy theo —
# tức một cú bấm hoá thành hai lần deploy. Cắt cả hai đầu.
name: Promote Production

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Chạy sau MỖI lần Deploy Staging xong, nên hai lần deploy gần nhau sinh ra hai tiến trình cùng thao
# tác trên một PR.
#
# `cancel-in-progress: true` ở đây là đúng, khác với các workflow deploy: lần chạy sau luôn mang
# `develop` MỚI HƠN, nên hủy lần cũ không mất gì. Ngược lại, một lần deploy bị hủy giữa chừng là để
# lại máy thật ở trạng thái dở.
concurrency:
  group: promote-production
  cancel-in-progress: true

jobs:
  open-release-pr:
    name: open-release-pr
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # PR mở THẲNG từ `develop`, không qua nhánh phát hành trung gian.
      #
      # Vì sao bỏ nhánh `release/promote-develop-to-main`
      # ------------------------------------------------
      # Bản trước `git push --force-with-lease` một nhánh do BOT đẩy, và GitHub giữ mọi lần chạy
      # workflow do bot kích hoạt ở trạng thái `action_required` — chờ người bấm "Approve and run".
      # Đo được trên PR #386:
      #
      #     07:26  actor=Anpham120            CI success
      #     08:12  actor=github-actions[bot]  CI action_required
      #
      # Trước đây điều đó chỉ gây phiền. Từ khi `ai-data-and-eval` và `golden-e2e` thành check BẮT
      # BUỘC thì nó thành **chặn cứng**: PR phát hành không bao giờ có đủ check để merge, và nó nằm
      # đó ở trạng thái "Expected — waiting for status to be reported".
      #
      # PR `develop -> main` không có vấn đề đó: `develop` chỉ đổi khi một người merge một PR, nên
      # lần chạy CI mang actor là người thật.
      #
      # Bỏ nhánh trung gian còn xóa luôn ba thứ khác:
      #
      #     force-push một nhánh dùng chung   -> hết đua giữa hai lần chạy
      #     `contents: write`                 -> workflow này không còn cần quyền ghi mã
      #     một nhánh phải bảo trì            -> ít một chỗ để lệch
      #
      # Kết quả trên `main` giống hệt: merge commit của `develop`. Repo đã làm đúng cách này một lần
      # — PR #382 là `develop -> main` và merge sạch.
      - name: Mở hoặc làm mới PR develop -> main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail

          git fetch origin main develop

          if git diff --quiet origin/main..origin/develop; then
            echo "Không có gì để đưa lên: develop trùng main."
            exit 0
          fi

          so_commit="$(git rev-list --count origin/main..origin/develop)"

          body=$'PR tự động: bản trên `develop` đã deploy staging thành công.\n\n'
          body+=$'**Production được CHẶN — PR này KHÔNG tự merge.**\n'
          body+=$'Một người phải xem CI và staging rồi merge tay.\n\n'
          body+=$'Merge vào `main` sẽ kích hoạt Deploy Production, kèm health check sau deploy và '
          body+=$'auto-rollback nếu health check đỏ.\n\n'
          body+="Đang chênh **${so_commit} commit** so với \`main\`."

          existing_pr="$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh pr create --base main --head develop \
              --title "chore: đưa develop lên production" --body "$body"
            echo "Đã mở PR phát hành, chờ người duyệt."
          else
            gh pr comment "$existing_pr" \
              --body "Staging vừa xanh lại. PR phát hành đang chênh ${so_commit} commit so với \`main\`."
            echo "PR #${existing_pr} đã có; đã ghi chú và chờ người duyệt."
          fi

          echo "::notice::PR phát hành sẵn sàng. Production chỉ deploy sau khi một người merge vào main."
