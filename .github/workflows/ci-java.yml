# CI cho backend Java (fork cá nhân).
#
# File MỚI, cố ý không đụng `ci.yml` gốc: workflow đó đang phục vụ điểm môn INFO2005 của 4 người
# khác (§8.1). Mirror job `backend-test` của bản .NET nhưng cho toolchain Java.
name: ci-java

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend-java/**'
      - '.github/workflows/ci-java.yml'
  # KHÔNG lọc `paths` ở đây, dù PR sửa tài liệu cũng chạy. Lý do không phải là thừa:
  # `backend-java-build` được đặt làm required status check cho `develop`. Check bắt buộc
  # mà không chạy thì GitHub coi là PENDING mãi mãi, chứ không coi là bỏ qua — nên một PR
  # chỉ sửa tài liệu (như #84) sẽ không bao giờ merge được. Đổi ~2 phút runner lấy việc
  # cổng chặn hoạt động đúng là đáng.
  pull_request:
  # Chạy tay được, để kiểm backend trên một nhánh tính năng mà chưa muốn mở PR. Không có nó thì
  # cách duy nhất chạy phép kiểm backend là mở PR — tức phải công khai một việc đang làm dở chỉ
  # để biết nó có build được không.
  workflow_dispatch:

jobs:
  backend-java-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `backend-java/.gitignore` từng có dòng `out/` không neo, nên nó khớp luôn
      # `src/main/java/.../orders/adapter/out/` — thư mục outbound adapter của §5.3. Hệ quả:
      # OrderPersistenceAdapter.java tạo ở #61 không bao giờ vào được repo, `git status` vẫn sạch,
      # và ci-java hỏng biên dịch suốt 22 lần chạy liên tiếp. Bước này làm lỗi đó lộ ra ngay tên
      # file, thay vì lộ ra dưới dạng "cannot find symbol" ở tít cuối log Gradle.
      - name: Không file nguồn nào được phép bị .gitignore loại bỏ
        run: |
          ignored=$(git ls-files --others --ignored --exclude-standard | grep '/src/' || true)
          if [ -n "$ignored" ]; then
            echo "::error::Các file nguồn sau nằm trên đĩa nhưng bị .gitignore loại khỏi repo:"
            echo "$ignored"
            exit 1
          fi
          echo "OK — không có file nguồn nào bị loại."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Chạy tách khỏi test để log phân biệt được "biên dịch hỏng" với "test đỏ".
      # `build` kéo theo `check`, nên Checkstyle (import thừa) chạy ở đây.
      - name: Build + Checkstyle
        working-directory: backend-java
        run: ./gradlew --no-daemon build -x test

      # CHẶN merge. Gồm 82 test domain và test kiến trúc — không cái nào cần Docker.
      - name: Test domain + kiến trúc
        working-directory: backend-java
        run: ./gradlew --no-daemon test

      # ĐÃ BỎ `continue-on-error` (#137). Điều kiện ghi ở chú thích cũ — "giữ cho tới khi thấy nó
      # xanh ổn định" — đã được thoả, và bằng chứng mạnh hơn chính bước này.
      #
      # Lý do: bước `test` ở TRÊN loại trừ đúng một lớp (`RestaurantApplicationTests`), nên MỌI
      # lớp test Testcontainers thêm từ #126 tới #137 đều chạy trong bước ĐÓ — một cổng luôn chặn
      # merge. Đo trên hiện vật test-report của CI:
      #
      #     #126  TableSessionMemberLinkTest   6/0
      #     #129  MyLoyaltyLinkTest           11/0
      #     #136  RedeemConcurrencyTest        4/0
      #     #137  MyOrderHistoryTest           7/0
      #
      # Tức Testcontainers đã dựng Postgres thật trên runner GitHub hàng chục lần, trong một cổng
      # chặn, không lần nào hỏng. Giả thiết mà cờ này phòng ngừa — "Testcontainers có thể không
      # chạy được ở đây" — đã bị bác bỏ bằng dữ liệu.
      #
      # Giữ cờ thêm nữa là giữ một bước KHÔNG BAO GIỜ chặn được gì: `RestaurantApplicationTests`
      # có thể đỏ mà bảng check vẫn xanh, và không ai biết context Spring đã ngừng khởi động.
      - name: Integration test (Testcontainers)
        working-directory: backend-java
        run: ./gradlew --no-daemon integrationTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-report
          path: backend-java/build/reports/tests
          if-no-files-found: ignore
